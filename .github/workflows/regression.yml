name: regression

# 只做回归网：类型检查 + 单元测试，不部署。
# 两道都得跑——`vue-tsc` 红而 vitest 绿（或反过来）都算这仓坏，历史上出现过只跑一道的假绿。

on:
  pull_request:
  push:
    branches:
      - main
  # SPEC-UI-6 M4：重试矩阵只在夜间跑（要一整套前后端与超管账号，不适合挂 PR 上）
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与产出这条基线的本机同大版本（node 24），避免「CI 绿 / 本地红」这种分不清谁的错
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx vue-tsc -b

      # Spec-UI-6 T8：静态拦住「绑了 :error 却没有重试 / 错误态被 v-if 挡死」的新写法，
      # 不依赖谁记得手测；删掉任一页面的错误态，这一步会红。
      - name: Table state guard
        run: npm run check:table-states

      # SPEC-UI-11 R-9 硬门：首屏常驻 info/warning「口径说明」一律失败（2026-11-12 起不再只警告）。
      # 这类说明归机器人（copy/robot.ts 的页面说明卡 + 页头问号），写在页面里就又变成每页一块大色块。
      - name: Notice guard
        run: npm run check:notices

      - name: Unit tests
        run: npx vitest run

  # SPEC-UI-6 M4：5 页 × 断网 / 500 / 403 的重试行为回归。
  # 红灯输出「哪一页、哪种模式、哪一步没恢复」，见 scripts/e2e/retry-matrix.mjs。
  # 没配 E2E_BASE_URL（仓库变量）时这一支会打印 SKIP 并绿——真测依赖可复现的整套环境，
  # 环境缺席不能天天红，但配了就按 REQUIRED 跑（跳过即失败）。
  retry-matrix:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Retry matrix
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_REQUIRED: ${{ vars.E2E_BASE_URL != '' && '1' || '0' }}
          E2E_CHANNEL: none
        run: node scripts/e2e/retry-matrix.mjs

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retry-matrix-report
          path: e2e-out/retry-matrix.json
          if-no-files-found: ignore

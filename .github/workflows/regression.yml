name: regression

# 只做回归网：类型检查 + 单元测试，不部署。
# 两道都得跑——`vue-tsc` 红而 vitest 绿（或反过来）都算这仓坏，历史上出现过只跑一道的假绿。

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与产出这条基线的本机同大版本（node 24），避免「CI 绿 / 本地红」这种分不清谁的错
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx vue-tsc -b

      # Spec-UI-6 T8：静态拦住「绑了 :error 却没有重试 / 错误态被 v-if 挡死」的新写法，
      # 不依赖谁记得手测；删掉任一页面的错误态，这一步会红。
      - name: Table state guard
        run: npm run check:table-states

      - name: Unit tests
        run: npx vitest run
